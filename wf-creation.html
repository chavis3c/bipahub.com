    async function atLoad() {
      try {
        const r = await fetch(`${AT_URL}?filterByFormula=%7BKey%7D%3D%22${AT_KEY}%22`,
          { headers:{ Authorization:`Bearer ${AT_TOKEN}` } });
        const d = await r.json();
        if (d.records && d.records.length > 0) {
          AT_RID = d.records[0].id;
          const parsed = JSON.parse(d.records[0].fields.Value || "{}");
          if (parsed.checks) return { checks: parsed.checks, timestamps: parsed.timestamps || {}, verifications: parsed.verifications || {}, scores: parsed.scores || {} };
          return { checks: parsed, timestamps: {}, verifications: {}, scores: {} };
        }
        return null;
      } catch(e) { return null; }
    }

    async function atSave(checks, timestamps, verifications, scores) {
      try {
        const body = { fields:{ Key:AT_KEY, Value:JSON.stringify({ checks, timestamps, verifications: verifications||{}, scores: scores||{}, savedAt: new Date().toISOString() }) } };
        if (AT_RID) {
          await fetch(`${AT_URL}/${AT_RID}`, {
            method:"PATCH",
            headers:{ Authorization:`Bearer ${AT_TOKEN}`, "Content-Type":"application/json" },
            body: JSON.stringify(body)
          });
        } else {
          const r = await fetch(AT_URL, {
            method:"POST",
            headers:{ Authorization:`Bearer ${AT_TOKEN}`, "Content-Type":"application/json" },
            body: JSON.stringify(body)
          });
          const d = await r.json();
          AT_RID = d.id;
        }
        return true;
      } catch(e) { return false; }
    }

    /* ── helpers to read from localStorage ── */
    const lsGet = (key) => { try { const s=localStorage.getItem(key); return s?JSON.parse(s):{}; } catch(e){ return {}; } };

    function App() {
      const [activeWk, setActiveWk] = useState(1);
      const [view, setView]         = useState("leaderboard");
      const [checks,        setChecks]        = useState(() => lsGet("vsg_sprint_checks"));

      const [syncing,       setSyncing]       = useState(false);

      const stateRef = useRef({ checks:{}, timestamps:{}, verifications:{}, scores:{} });

      const unlockAdmin = () => {
        const pin = prompt("Enter Admin PIN to verify tasks:");
        if (pin === "CHAVIS1946") { setAdminUnlocked(true); alert("✅ Admin mode unlocked!"); }
        else if (pin !== null)   { alert("❌ Wrong PIN. Contact Chavis."); }
      };

      /* ── Global resets ── */
      const resetTasks = () => {
        if (!adminUnlocked) { unlockAdmin(); return; }
        if (!confirm("Reset ALL tasks & timestamps? (Verifications & scores kept)")) return;
        const { verifications:v, scores:sc } = stateRef.current;
        setChecks({}); setTimestamps({});
        lsSet("vsg_sprint_checks", {}); lsSet("vsg_sprint_ts", {});
        setSyncMsg("💾 Saving reset…");
        atSave({}, {}, v, sc).then(ok => setSyncMsg(ok ? "☁️ Tasks reset ✓" : "⚠️ Cloud save failed — local OK"));
      };
      const resetVerifications = () => {
        if (!adminUnlocked) { unlockAdmin(); return; }
        if (!confirm("Reset ALL verifications? (Tasks & scores kept)")) return;
        const { checks:c, timestamps:t, scores:sc } = stateRef.current;
        setVerifications({});
        lsSet("vsg_sprint_verif", {});
        setSyncMsg("💾 Saving reset…");
        atSave(c, t, {}, sc).then(ok => setSyncMsg(ok ? "☁️ Verifications reset ✓" : "⚠️ Cloud save failed — local OK"));
      };

      /* ── Per-week resets ── */
      const resetWeekTasks = (wk) => {
        if (!adminUnlocked) { unlockAdmin(); return; }
        if (!confirm(`Reset tasks & timestamps for Wk${wk} only? (Scores & verifications kept)`)) return;
        const { checks:c, timestamps:t, verifications:v, scores:sc } = stateRef.current;
        const nextC = Object.fromEntries(Object.entries(c).filter(([k]) => !k.startsWith(``) || !k.match(new RegExp(`^\\d+-${wk}-`))));
        // filter out keys matching any-id - wk - ti
        const wkPattern = new RegExp(`^\\d+-${wk}-\\d+$`);
        const filtC = Object.fromEntries(Object.entries(c).filter(([k]) => !wkPattern.test(k)));
        const filtT = Object.fromEntries(Object.entries(t).filter(([k]) => !wkPattern.test(k)));
        setChecks(filtC); setTimestamps(filtT);
        lsSet("vsg_sprint_checks", filtC); lsSet("vsg_sprint_ts", filtT);
        setSyncMsg("💾 Saving…");
        atSave(filtC, filtT, v, sc).then(ok => setSyncMsg(ok ? `☁️ Wk${wk} tasks reset ✓` : "⚠️ Cloud save failed — local OK"));
      };
      const resetWeekVerifications = (wk) => {
        if (!adminUnlocked) { unlockAdmin(); return; }
        if (!confirm(`Reset verifications for Wk${wk} only? (Tasks & scores kept)`)) return;
        const { checks:c, timestamps:t, verifications:v, scores:sc } = stateRef.current;
        const wkPattern = new RegExp(`^\\d+-${wk}-\\d+$`);
        const filtV = Object.fromEntries(Object.entries(v).filter(([k]) => !wkPattern.test(k)));
        setVerifications(filtV);
        lsSet("vsg_sprint_verif", filtV);
        setSyncMsg("💾 Saving…");
        atSave(c, t, filtV, sc).then(ok => setSyncMsg(ok ? `☁️ Wk${wk} verifications reset ✓` : "⚠️ Cloud save failed — local OK"));
      };

      /* Auto-redirect away from Wk4 if not admin */
      useEffect(() => {
        if (activeWk === 4 && !adminUnlocked) setActiveWk(1);
      }, [adminUnlocked]);

      /* Initial cloud load */
      useEffect(() => {
        atLoad().then(result => {
          const atChecks = result ? result.checks : {};
          const atTs     = result ? result.timestamps : {};
          const atCount  = Object.values(atChecks).filter(Boolean).length;
          const lsChecks = lsGet("vsg_sprint_checks");
          const lsTs     = lsGet("vsg_sprint_ts");
          const lsCount  = Object.values(lsChecks).filter(Boolean).length;
          if (atCount >= lsCount && atCount > 0) {
            const atVerif  = result.verifications || {};
            const atScores = result.scores || {};
            setChecks(atChecks); setTimestamps(atTs); setVerifications(atVerif); setScores(atScores);
            lsSet("vsg_sprint_checks", atChecks); lsSet("vsg_sprint_ts", atTs);
            lsSet("vsg_sprint_verif", atVerif);   lsSet("vsg_sprint_scores", atScores);
            setSyncMsg("☁️ Loaded from cloud (" + atCount + " tasks)");
          } else if (lsCount > 0) {
            setSyncMsg("☁️ Using local data (" + lsCount + " tasks) — syncing…");
            atSave(lsChecks, lsTs, lsGet("vsg_sprint_verif"), lsGet("vsg_sprint_scores"))
              .then(ok => setSyncMsg(ok ? "☁️ Synced ✓ (" + lsCount + " tasks)" : "⚠️ Cloud unavailable — local OK"));
          } else {
            setSyncMsg("☁️ Ready — no data yet");
          }
        });
      }, []);

      /* ── Scoring helpers ── */
      const getScore = (id) => {
        let s = 0;
        WEEKS.forEach(w => w.tasks.forEach((_, ti) => { if (checks[`${id}-${w.wk}-${ti}`]) s++; }));
        return s;
      };
      const getCriterionScore    = (id, wk, ci) => scores[`${id}-${wk}-c${ci}`] || 0;
      const getWkTotalFromCriteria = (id, wk) =>
        WK_CRITERIA[wk].reduce((sum, _, ci) => sum + getCriterionScore(id, wk, ci), 0);
      const getTotalScore = (id) => WEEKS.reduce((sum, w) => sum + getWkTotalFromCriteria(id, w.wk), 0);

      /* ── Toggle task ── */
      const toggle = (id, wk, ti) => {
        const k = `${id}-${wk}-${ti}`;
        const now = new Date().toISOString();
        setChecks(prevC => {
          const nextC = { ...prevC, [k]: !prevC[k] };
          setTimestamps(prevT => {
            const nextT = { ...prevT };
            if (nextC[k]) { nextT[k] = now; } else { delete nextT[k]; }
            lsSet("vsg_sprint_checks", nextC);
            lsSet("vsg_sprint_ts", nextT);
            setSyncMsg("💾 Saving…");
            const curV  = lsGet("vsg_sprint_verif");
            const curSc = lsGet("vsg_sprint_scores");
            atSave(nextC, nextT, curV, curSc)
              .then(ok => setSyncMsg(ok ? "☁️ Saved ✓ " + new Date().toLocaleTimeString('vi-VN') : "⚠️ Cloud save failed — local OK"));
            return nextT;
          });
          return nextC;
        });
      };

      /* ── Set criterion score ── */
      const setCriterionScore = (memberId, wk, ci, val) => {
        const k = `${memberId}-${wk}-c${ci}`;
        setScores(prev => {
          const next = { ...prev, [k]: Number(val) };
          lsSet("vsg_sprint_scores", next);
          setSyncMsg("💾 Saving score…");
          atSave(lsGet("vsg_sprint_checks"), lsGet("vsg_sprint_ts"), lsGet("vsg_sprint_verif"), next)
            .then(ok => setSyncMsg(ok ? "☁️ Score saved ✓" : "⚠️ Cloud save failed — local OK"));
          return next;
        });
      };

      /* ── Verifications ── */
      const isTaskVerified       = (id, wk, ti) => !!verifications[`${id}-${wk}-${ti}`];
      const isMemberFullyVerified = (id, wk) =>
        WEEKS.find(w => w.wk === wk).tasks.every((_, ti) => isTaskVerified(id, wk, ti));
      const verifyTask = (id, wk, ti) => {
        const k = `${id}-${wk}-${ti}`;
        setVerifications(prev => {
          const next = { ...prev, [k]: new Date().toISOString() };
          lsSet("vsg_sprint_verif", next);
          setSyncMsg("💾 Saving…");
          atSave(lsGet("vsg_sprint_checks"), lsGet("vsg_sprint_ts"), next, lsGet("vsg_sprint_scores"))
            .then(ok => setSyncMsg(ok ? "☁️ Task verified ✓" : "⚠️ Cloud save failed — local OK"));
          return next;
        });
      };
      const unverifyTask = (id, wk, ti) => {
        const k = `${id}-${wk}-${ti}`;
        setVerifications(prev => {
          const next = { ...prev }; delete next[k];
          lsSet("vsg_sprint_verif", next);
          atSave(lsGet("vsg_sprint_checks"), lsGet("vsg_sprint_ts"), next, lsGet("vsg_sprint_scores"))
            .then(ok => setSyncMsg(ok ? "☁️ Unverified ✓" : "⚠️ Cloud save failed — local OK"));
          return next;
        });
      };

      /* ── Save / Load JSON ── */
      const saveProgress = () => {
        const { checks:c, timestamps:t, verifications:v, scores:sc } = stateRef.current;
        const data = { checks:c, timestamps:t, verifications:v, scores:sc, savedAt: new Date().toISOString(), version: "VSG-Sprint-v3" };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url; a.download = "VSG_Sprint_" + new Date().toISOString().slice(0,10) + ".json"; a.click();
        URL.revokeObjectURL(url);
        setSyncMsg("💾 File saved locally ✓");
      };
      const loadProgress = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data  = JSON.parse(ev.target.result);
            const c     = data.checks || data;
            const t     = data.timestamps || {};
            const v     = data.verifications || {};
            const sc    = data.scores || {};
            setChecks(c); setTimestamps(t); setVerifications(v); setScores(sc);
            lsSet("vsg_sprint_checks", c); lsSet("vsg_sprint_ts", t);
            lsSet("vsg_sprint_verif", v);  lsSet("vsg_sprint_scores", sc);
            setSyncMsg("💾 Saving to cloud…");
            atSave(c, t, v, sc).then(ok => setSyncMsg(ok ? "☁️ Loaded & synced ✓" : "⚠️ Loaded locally — cloud sync failed"));
            alert("✅ Progress loaded successfully!");
          } catch(err) { alert("❌ Invalid file."); }
        };
        reader.readAsText(file);
      };

      /* ── Derived stats ── */
      const totalChecks   = Object.values(checks).filter(Boolean).length;
      const totalPossible = TEAM.length * 16;
      const teamPct       = Math.round((totalChecks / totalPossible) * 100);
      const hasWeekComplete = (id) => WEEKS.some(w => w.tasks.every((_, ti) => checks[`${id}-${w.wk}-${ti}`]));
      const wkCompleted   = TEAM.reduce((sum,m) =>
        sum + WEEKS.find(w=>w.wk===activeWk).tasks.filter((_,ti)=>checks[`${m.id}-${activeWk}-${ti}`]).length, 0);
      const wkTotal = TEAM.length * 4;

      /* ── Champion ranking ── */
      const getEarliestFinish = (id) => {
        const ts = Object.keys(timestamps).filter(k=>k.startsWith(`${id}-`)&&checks[k]&&timestamps[k]).map(k=>timestamps[k]);
        return ts.length ? ts.sort()[ts.length-1] : "9999";
      };
      const championSort = (a, b) => {
        const scoreDiff = getTotalScore(b.id) - getTotalScore(a.id);
        if (scoreDiff !== 0) return scoreDiff;
        const taskDiff  = getScore(b.id) - getScore(a.id);
        if (taskDiff  !== 0) return taskDiff;
        return getEarliestFinish(a.id).localeCompare(getEarliestFinish(b.id));
      };
      const isEligible = (id) => WEEKS.some(wk =>
        getWkTotalFromCriteria(id, wk.wk) > 0 &&
        wk.tasks.every((_, ti) => checks[`${id}-${wk.wk}-${ti}`]) &&
        isMemberFullyVerified(id, wk.wk)
      );
      const rankedAll      = [...TEAM].filter(m => isEligible(m.id)).sort(championSort);
      const champion1      = rankedAll[0] || null;
      const champion2      = rankedAll[1] || null;
      const champion3      = rankedAll[2] || null;

      const getWeekChampion = (wk) => {
        const wkRanked = TEAM.map(m => {
          const done = WEEKS.find(w=>w.wk===wk).tasks.filter((_,ti)=>checks[`${m.id}-${wk}-${ti}`]).length;
          return { m, s: getWkTotalFromCriteria(m.id, wk), done };
        })
        .filter(x => x.s > 0 && x.done === 4)
        .sort((a, b) => {
          if (b.s !== a.s) return b.s - a.s;
          if (b.done !== a.done) return b.done - a.done;
          const aTs = Object.keys(timestamps).filter(k=>k.startsWith(`${a.m.id}-${wk}-`)&&checks[k]).map(k=>timestamps[k]).sort().pop()||"9999";
          const bTs = Object.keys(timestamps).filter(k=>k.startsWith(`${b.m.id}-${wk}-`)&&checks[k]).map(k=>timestamps[k]).sort().pop()||"9999";
          return aTs.localeCompare(bTs);
        });
        return wkRanked[0] || null;
      };

      const ranked = [...TEAM].map(m => ({ ...m, score: getScore(m.id) })).sort((a,b) => b.score - a.score);
      const wk     = WEEKS.find(w => w.wk === activeWk);

      /* ── Styles ── */
      const s = {
        wrap:    { fontFamily:"'Segoe UI',Arial,sans-serif", background:"#C7F068", minHeight:"100vh", color:"#1a2332" },
        hdr:     { background:NAVY, position:"relative", overflow:"hidden" },
        hdrDeco: { position:"absolute", top:-60, right:-80, width:280, height:280, background:"rgba(255,255,255,.03)", borderRadius:"50%", pointerEvents:"none" },
        hdrInner:{ maxWidth:960, margin:"0 auto", padding:"22px 24px 18px", display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, position:"relative" },
        brand:   { fontSize:10, fontWeight:600, letterSpacing:"0.18em", textTransform:"uppercase", color:"rgba(255,255,255,.5)", marginBottom:4 },
        hdrTtl:  { fontSize:26, fontWeight:800, color:"#fff", lineHeight:1.1, margin:0 },
        hdrSub:  { fontSize:12.5, color:"rgba(255,255,255,.6)", marginTop:3, fontStyle:"italic" },
        bar:     { height:4, background:ORANGE, position:"relative" },
        barGlow: { position:"absolute", left:0, top:0, width:80, height:4, background:ORANGE_LT },
        hdrRight:{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:8, flexShrink:0 },
        progBox: { textAlign:"right" },
        progLbl: { fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:"rgba(255,255,255,.45)", marginBottom:2 },
        progPct: { fontSize:32, fontWeight:800, color:ORANGE_LT, lineHeight:1 },
        progSub: { fontSize:11, color:"rgba(255,255,255,.4)" },
        main:    { maxWidth:960, margin:"0 auto", padding:"16px 24px 40px" },
        card:    { background:"#fff", borderRadius:10, border:"1px solid #e2e8f0", padding:"12px 14px" },
        cardLbl: { fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"#94a3b8", marginBottom:4 },
        cardVal: { fontSize:22, fontWeight:800, color:NAVY, lineHeight:1 },
        cardSub: { fontSize:10, color:"#94a3b8", marginTop:2 },
        wkBand:  { background:"#fff", borderRadius:10, border:"1px solid #e2e8f0", padding:"12px 18px", marginBottom:8, display:"flex", alignItems:"center", gap:14 },
        wkEmoji: { fontSize:22 },
        wkName:  { fontSize:15, fontWeight:800, color:NAVY },
        wkTheme: { fontSize:12, color:"#94a3b8", marginTop:1 },
        miles:   { display:"flex", gap:7, flexWrap:"wrap", marginLeft:"auto" },
        mileTag: { fontSize:11, fontWeight:600, padding:"4px 11px", borderRadius:20, background:"#f1f5f9", color:"#475569", border:"1px solid #e2e8f0" },
        lbRow:   () => ({ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", background:"#fff", borderRadius:9, border:"1px solid #e2e8f0", marginBottom:7 }),
        rank:    { fontSize:13, fontWeight:800, color:"#94a3b8", width:20, textAlign:"center", flexShrink:0 },
        av:      (color) => ({ width:38, height:38, borderRadius:"50%", background:color, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:13, fontWeight:800, flexShrink:0 }),
        mName:   { fontSize:14, fontWeight:700, color:NAVY },
        badge:   (bg,col) => ({ fontSize:11, fontWeight:700, padding:"2px 9px", borderRadius:20, background:bg, color:col }),
        barWrap: { flex:1, height:6, background:"#f1f5f9", borderRadius:3, overflow:"hidden" },
        barFill: (score,color) => ({ height:"100%", borderRadius:3, background:color, width:`${(score/16)*100}%` }),
        scoreLbl:{ fontSize:13, fontWeight:800, color:NAVY, width:38, textAlign:"right", flexShrink:0 },
        grid:    { display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 },
        gridCard:{ background:"#fff", borderRadius:10, border:"1px solid #e2e8f0", padding:"16px", overflow:"hidden" },
        gcTop:   { display:"flex", alignItems:"center", gap:10, marginBottom:10 },
        gcMission:{ fontSize:11.5, color:"#64748b", fontStyle:"italic", marginBottom:10, lineHeight:1.4 },
        wkBar:   { marginBottom:6 },
        wkBarLbl:{ display:"flex", justifyContent:"space-between", fontSize:10.5, color:"#94a3b8", fontWeight:600, marginBottom:3 },
        wkBarBg: { height:4, background:"#f1f5f9", borderRadius:2, overflow:"hidden" },
        wkBarFl: (pct,color) => ({ height:"100%", width:`${pct}%`, background:color, borderRadius:2 }),
        ttCard:  { background:"#fff", borderRadius:10, border:"1px solid #e2e8f0", padding:"16px 18px", marginBottom:9 },
        ttHdr:   { display:"flex", alignItems:"center", gap:10, marginBottom:10, cursor:"pointer" },
        ttAvRow: { display:"flex", alignItems:"center", gap:10, flex:1 },
        ttTasks: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:7 },
        ttTask:  (done) => ({ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", borderRadius:7, background:done?"#f0fdf4":"#f8fafc", border:`1px solid ${done?"#bbf7d0":"#e2e8f0"}`, cursor:"pointer" }),
        ttChk:   (done) => ({ width:16, height:16, borderRadius:4, border:`2px solid ${done?"#16a34a":"#cbd5e1"}`, background:done?"#16a34a":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }),

            <div style={s.bar}><div style={s.barGlow}/></div>

            <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              {adminUnlocked
                ? <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontSize:11,color:"#166534",fontWeight:600,background:"#dcfce7",padding:"4px 12px",borderRadius:20}}>🔓 Admin Mode Active</span>
                    <button onClick={()=>setAdminUnlocked(false)} style={{fontSize:11,fontWeight:600,background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:20,padding:"4px 12px",cursor:"pointer"}}>🔒 Lock Admin</button>
                  </div>
                : <button onClick={unlockAdmin} style={{fontSize:11,fontWeight:600,background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:20,padding:"4px 12px",cursor:"pointer"}}>🔒 Admin Login</button>
              }
            </div>

            {/* ── Per-Week Reset Panel (admin only) ── */}
            {adminUnlocked && (
              <div style={{background:"#fff",border:"2px solid #fed7aa",borderRadius:12,padding:"12px 16px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <span style={{fontSize:13,fontWeight:800,color:"#9a3412"}}>⚙️ Admin Reset Controls</span>
                  <span style={{fontSize:11,color:"#92400e",background:"#fff7ed",padding:"2px 10px",borderRadius:20,border:"1px solid #fed7aa"}}>Only resets the selected week — other weeks are safe</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                  {WEEKS.map(w => {
                    const wkColors = {1:"#e85d1a",2:"#166534",3:"#1e40af",4:"#7c3aed"};
                    const col = wkColors[w.wk];
                    const disabled = w.wk === 4 ? false : false; // all weeks accessible in admin
                    return (
                      <div key={w.wk} style={{border:`1.5px solid ${col}30`,borderRadius:10,padding:"10px 12px",background:`${col}08`}}>
                        <div style={{fontSize:12,fontWeight:800,color:col,marginBottom:8}}>{w.emoji} {w.label.split(": ")[1]}</div>
                        <button onClick={()=>resetWeekTasks(w.wk)}
                          style={{width:"100%",marginBottom:5,fontSize:11,fontWeight:700,background:"#fee2e2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:8,padding:"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                          🔄 Reset Wk{w.wk} Tasks
                        </button>
                        <button onClick={()=>resetWeekVerifications(w.wk)}
                          style={{width:"100%",fontSize:11,fontWeight:700,background:"#fef3c7",color:"#b45309",border:"1px solid #fcd34d",borderRadius:8,padding:"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                          🔓 Reset Wk{w.wk} Verified
                        </button>
                      </div>
                    );
                  })}
                </div>
                <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid #fed7aa",display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:10,color:"#92400e",fontWeight:600}}>⚠️ Nuclear options (resets ALL weeks):</span>
                  <button onClick={resetTasks}         style={{fontSize:10,fontWeight:700,background:"#fee2e2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:20,padding:"3px 10px",cursor:"pointer"}}>🔄 Reset ALL Tasks</button>
                  <button onClick={resetVerifications} style={{fontSize:10,fontWeight:700,background:"#fef3c7",color:"#b45309",border:"1px solid #fcd34d",borderRadius:20,padding:"3px 10px",cursor:"pointer"}}>🔓 Reset ALL Verified</button>
                </div>
              </div>
            )}

            {/* ── Stats Row 1: general ── */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:8}}>
              {[
                { lbl:"Team Members",             val:9,                                           sub:"3 groups · active" },
                { lbl:`Wk ${activeWk} Completed`, val:`${wkCompleted}/${wkTotal}`,                 sub:"tasks this week" },
                { lbl:"✅ Verified",              val:`${TEAM.filter(m=>isMemberFullyVerified(m.id,activeWk)).length}/9`, sub:`all 4 tasks · Wk ${activeWk}` },
              ].map((c,i) => (
                <div key={i} style={s.card}>
                  <div style={s.cardLbl}>{c.lbl}</div>
                  <div style={s.cardVal}>{c.val}</div>
                  <div style={s.cardSub}>{c.sub}</div>
                </div>
              ))}
            </div>

            {/* ── Stats Row 2: Winners podium ── */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}}>
              <WinnerCard rank={1} member={champion1}
                rankLabel="Champion"   trophyEmoji="🥇"
                rankColor="#e85d1a"    rankBg="#fff7ed" />
              <WinnerCard rank={2} member={champion2}
                rankLabel="2nd Winner" trophyEmoji="🥈"
                rankColor="#1e40af"    rankBg="#eff6ff" />
              <WinnerCard rank={3} member={champion3}
                rankLabel="3rd Winner" trophyEmoji="🥉"
                rankColor="#166534"    rankBg="#f0fdf4" />
            </div>

            {/* ── Champion Rules ── */}
            <details style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 16px",marginBottom:12,cursor:"pointer"}}>
              <summary style={{fontSize:13,fontWeight:700,color:"#1a3a5c",listStyle:"none",display:"flex",alignItems:"center",gap:8}}>
                <span>📋 Champion Rules &amp; Scoring Framework</span>
                <span style={{fontSize:11,color:"#94a3b8",marginLeft:"auto"}}>▸ click to expand</span>
              </summary>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10,marginBottom:10}}>
                {[{wk:1,max:15,col:"#e85d1a"},{wk:2,max:40,col:"#166534"},{wk:3,max:30,col:"#1e40af"},{wk:4,max:15,col:"#7c3aed"}].map(w=>(
                  <div key={w.wk} style={{background:"#f8fafc",border:`2px solid ${w.col}`,borderRadius:8,padding:"8px",textAlign:"center"}}>
                    <div style={{fontSize:10,fontWeight:800,color:w.col}}>Wk{w.wk} — {["IGNITE","INSTALL","COMPETE","LOCK IN"][w.wk-1]}</div>
                    <div style={{fontSize:26,fontWeight:900,color:w.col,lineHeight:1.1}}>{w.max}</div>
                    <div style={{fontSize:9,color:"#94a3b8"}}>pts ({w.max}% of 100)</div>
                  </div>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:10}}>
                <div style={{background:"#fef3c7",borderRadius:8,padding:"9px 11px"}}><div style={{fontSize:11,fontWeight:800,color:"#92400e",marginBottom:3}}>🥇 Rule 1 — Total /100</div><div style={{fontSize:10,color:"#78350f"}}>Highest total wins. Wk1(15)+Wk2(40)+Wk3(30)+Wk4(15)=<strong>100pts</strong></div></div>
                <div style={{background:"#dbeafe",borderRadius:8,padding:"9px 11px"}}><div style={{fontSize:11,fontWeight:800,color:"#1e40af",marginBottom:3}}>🥈 Rule 2 — Tasks Done</div><div style={{fontSize:10,color:"#1e3a8a"}}>If tied → most tasks completed (out of 16) wins</div></div>
                <div style={{background:"#dcfce7",borderRadius:8,padding:"9px 11px"}}><div style={{fontSize:11,fontWeight:800,color:"#166534",marginBottom:3}}>🥉 Rule 3 — Earliest Finish</div><div style={{fontSize:10,color:"#14532d"}}>If still tied → finished last task earliest wins</div></div>

                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead>
                        <tr style={{background:"#f8fafc"}}>
                          <th style={{padding:"8px 12px",textAlign:"left",fontWeight:700,color:"#64748b",borderBottom:"1px solid #e2e8f0",width:160}}>Member</th>
                          {w.tasks.map((t,ti)=>(
                            <th key={ti} style={{padding:"7px 6px",textAlign:"center",fontWeight:600,color:"#64748b",borderBottom:"1px solid #e2e8f0",fontSize:10}}>{ti+1}. {t.length>16?t.slice(0,16)+"…":t}</th>
                          ))}
                          <th style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:NAVY,borderBottom:"1px solid #e2e8f0"}}>Score</th>
                          <th style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:"#166534",borderBottom:"1px solid #e2e8f0"}}>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {TEAM.map((m,ri) => {
                          const fullyVerif = isMemberFullyVerified(m.id, w.wk);
                          return (
                            <tr key={m.id} style={{background:ri%2===0?"#fff":"#f8fafc",borderBottom:"1px solid #f1f5f9"}}>
                              <td style={{padding:"8px 12px"}}>
                                <div style={{display:"flex",alignItems:"center",gap:7}}>
                                  <div style={{width:24,height:24,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:9,fontWeight:800,flexShrink:0}}>{m.initials}</div>
                                  <div>
                                    <div style={{fontWeight:700,color:NAVY,fontSize:12}}>{m.name}</div>
                                    <div style={{fontSize:10,color:"#94a3b8"}}>{m.seq} · {m.role}</div>
                                  </div>
                                </div>
                              </td>
                              {w.tasks.map((_,ti) => {
                                const done  = !!checks[`${m.id}-${w.wk}-${ti}`];
                                const verif = isTaskVerified(m.id, w.wk, ti);
                                return (
                                  <td key={ti} style={{padding:"6px 6px",textAlign:"center",background:verif?"#f0fdf4":done?"#f8fafc":"#fff"}}>
                                    {done
                                      ? <div>
                                          <div style={{fontSize:12}}>{verif?"✅":"✔️"}</div>
                                          {verif && <div style={{fontSize:10,color:"#16a34a",whiteSpace:"nowrap"}}>{new Date(verifications[`${m.id}-${w.wk}-${ti}`]).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>}
                                          {!verif && <div style={{fontSize:8,color:"#f59e0b"}}>⏳</div>}
                                          {getCriterionScore(m.id,w.wk,ti)>0&&<div style={{fontSize:13,fontWeight:800,color:"#e85d1a",marginTop:2}}>{getCriterionScore(m.id,w.wk,ti)}/{WK_CRITERIA[w.wk][ti]?.pts||0}pts</div>}
                                        </div>
                                      : <span style={{color:"#e2e8f0",fontSize:13}}>—</span>}
                                  </td>
                                );
                              })}
                              <td style={{padding:"6px 8px",textAlign:"center"}}>
                                {(()=>{
                                  const wkMax     = WK_MAX[w.wk];
                                  const critTotal = getWkTotalFromCriteria(m.id, w.wk);
                                  const tier      = WK_TIERS[w.wk].find(t=>critTotal>=t.min&&critTotal<=t.max);
                                  const tasksDone = w.tasks.filter((_,ti)=>checks[`${m.id}-${w.wk}-${ti}`]).length;
                                  return tasksDone > 0 && critTotal > 0
                                    ? <div>
                                        <span style={{fontSize:14,fontWeight:800,color:critTotal>=(wkMax*0.9)?ORANGE:NAVY}}>{critTotal}/{wkMax}</span>
                                        {tier && <div style={{fontSize:9,color:tier.color,fontWeight:700,marginTop:1}}>{tier.label}</div>}
                                      </div>
                                    : <span style={{color:"#e2e8f0",fontSize:12}}>0/{wkMax}</span>;
                                })()}
                              </td>
                              <td style={{padding:"6px 8px",textAlign:"center"}}>
                                {fullyVerif
                                  ? <span style={{fontSize:11,fontWeight:700,color:"#166534",background:"#dcfce7",padding:"2px 9px",borderRadius:20}}>✅ Done</span>
                                  : <span style={{fontSize:11,color:"#94a3b8",background:"#f1f5f9",padding:"2px 9px",borderRadius:20}}>⏳ Pending</span>}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ))}
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
